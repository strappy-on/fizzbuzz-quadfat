#
# build.yml — FizzBuzz macOS Quad-Fat + iOS FAT builds in GitHub Actions.
#
# Single job: build-and-test
#
# The job downloads/extracts/builds all cross-toolchains, compiles the 6
# slices, lipos the two fat binaries, validates (arch-set assertion +
# per-slice min-OS), runs the host test, and uploads ONLY the two tiny
# fat binaries + manifest (no multi-GB toolchain artifacts).
#
# SDK URL resolution: SECRET-PREFERRED, PUBLIC-FALLBACK.
# The three SDK archives are public GitHub release assets; the secrets
# (ALTIVEC_SDK_MACOS_105_URL, ALTIVEC_SDK_MACOS_113_URL,
# ALTIVEC_SDK_IPHONEOS_84_URL) are used if populated, otherwise the
# public URLs embedded below are used.
#

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # danupsher/tiger-ppc-builds — self-contained PPC cross compiler
  # (GCC 15 + ld64 + cctools + 10.4u SDK).
  PPC_TARBALL_URL: https://github.com/danupsher/tiger-ppc-builds/releases/download/gcc15-xcompiler-1.2/ppc-tiger-gcc15-xcompiler.tar.gz
  PPC_TARBALL: ppc-tiger-gcc15-xcompiler.tar.gz
  PPC_INSTALL_DIR: ppc-tiger-xcompiler

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # -------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
      - name: Announce checkout
        run: |
          set -e
          echo "=== Step 1: Checkout complete ==="

      # -------------------------------------------------------------------
      # 2. Install all apt dependencies in one shot
      # -------------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e
          echo "=== Step 2: Install apt dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang g++ cmake ninja-build \
            pkg-config libmpc-dev libmpfr-dev libgmp-dev libisl-dev \
            zlib1g-dev libelf-dev libxml2-dev libssl-dev \
            libblocksruntime-dev libffi-dev \
            git curl ca-certificates xz-utils python3 file
          echo "Dependencies installed."

      # -------------------------------------------------------------------
      # 3a. Download MacOSX10.5 SDK (secret-preferred, public-fallback)
      # -------------------------------------------------------------------
      - name: Download MacOSX10.5 SDK
        run: |
          set -e
          echo "=== Step 3a: Download MacOSX10.5 SDK ==="
          mkdir -p sdk
          URL="${{ secrets.ALTIVEC_SDK_MACOS_105_URL }}"
          [ -n "$URL" ] || URL="https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.5.sdk.tar.xz"
          echo "Using macOS 10.5 SDK URL (length ${#URL})"
          curl -fsSL --retry 3 -o sdk/MacOSX10.5.sdk.tar.xz "$URL"
          ls -l sdk/MacOSX10.5.sdk.tar.xz

      # -------------------------------------------------------------------
      # 3b. Download MacOSX11.3 SDK (secret-preferred, public-fallback)
      # -------------------------------------------------------------------
      - name: Download MacOSX11.3 SDK
        run: |
          set -e
          echo "=== Step 3b: Download MacOSX11.3 SDK ==="
          mkdir -p sdk
          URL="${{ secrets.ALTIVEC_SDK_MACOS_113_URL }}"
          [ -n "$URL" ] || URL="https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz"
          echo "Using macOS 11.3 SDK URL (length ${#URL})"
          curl -fsSL --retry 3 -o sdk/MacOSX11.3.sdk.tar.xz "$URL"
          ls -l sdk/MacOSX11.3.sdk.tar.xz

      # -------------------------------------------------------------------
      # 3c. Download iPhoneOS8.4 SDK (secret-preferred, public-fallback)
      # -------------------------------------------------------------------
      - name: Download iPhoneOS8.4 SDK
        run: |
          set -e
          echo "=== Step 3c: Download iPhoneOS8.4 SDK ==="
          mkdir -p sdk
          URL="${{ secrets.ALTIVEC_SDK_IPHONEOS_84_URL }}"
          [ -n "$URL" ] || URL="https://github.com/okanon/iPhoneOS.sdk/releases/download/v0.0.1/iPhoneOS8.4.sdk.tar.gz"
          echo "Using iPhoneOS 8.4 SDK URL (length ${#URL})"
          curl -fsSL --retry 3 -o sdk/iPhoneOS8.4.sdk.tar.gz "$URL"
          ls -l sdk/iPhoneOS8.4.sdk.tar.gz

      # -------------------------------------------------------------------
      # 4. Build PPC toolchain (danupsher, public, no secret) — cached
      # -------------------------------------------------------------------
      - name: Cache PPC toolchain (restore)
        id: ppc-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/ppc-tiger-xcompiler
          key: ppc-gcc15-xcompiler-1.2
          fail-on-cache-miss: false

      - name: Build PPC toolchain (danupsher v1.2)
        if: steps.ppc-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== Step 4: Build PPC toolchain (danupsher v1.2) ==="
          mkdir -p toolchain
          echo "Downloading $PPC_TARBALL_URL -> toolchain/$PPC_TARBALL"
          curl -fsSL --retry 3 -o "toolchain/$PPC_TARBALL" "$PPC_TARBALL_URL"
          ls -l "toolchain/$PPC_TARBALL"
          echo "Extracting toolchain/$PPC_TARBALL -> toolchain/"
          tar xzf "toolchain/$PPC_TARBALL" -C toolchain
          rm -f "toolchain/$PPC_TARBALL"
          ls -l "toolchain/$PPC_INSTALL_DIR"
          echo "Verifying ppc-ld64-gcc"
          chmod +x "toolchain/$PPC_INSTALL_DIR/bin/ppc-ld64-gcc" 2>/dev/null || true
          "toolchain/$PPC_INSTALL_DIR/bin/ppc-ld64-gcc" --version
          "toolchain/$PPC_INSTALL_DIR/bin/ppc-ld64-gcc" -dumpmachine
          test -d "toolchain/$PPC_INSTALL_DIR/sdk/MacOSX10.4u.sdk" \
            && echo "10.4u SDK present"
          echo "PPC toolchain built."

      - name: Cache PPC toolchain (save)
        if: steps.ppc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/ppc-tiger-xcompiler
          key: ppc-gcc15-xcompiler-1.2

      # -------------------------------------------------------------------
      # 5. Build i386 toolchain (osxcross-1.1, MacOSX10.5 SDK) — cached
      # -------------------------------------------------------------------
      - name: Cache i386 toolchain (restore)
        id: i386-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/osxcross-i386
          key: osxcross-i386-1.1-10.5
          fail-on-cache-miss: false

      - name: Build i386 toolchain (osxcross-1.1, MacOSX10.5)
        if: steps.i386-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== Step 5: Build i386 toolchain (osxcross-1.1, MacOSX10.5) ==="
          git clone --branch osxcross-1.1 https://github.com/tpoechtrager/osxcross.git toolchain/osxcross-i386
          git -C toolchain/osxcross-i386 log -1 --oneline
          echo "Staging SDK tarball into osxcross/tarballs/"
          mkdir -p toolchain/osxcross-i386/tarballs
          cp sdk/MacOSX10.5.sdk.tar.xz toolchain/osxcross-i386/tarballs/MacOSX10.5.sdk.tar.xz
          ls -l toolchain/osxcross-i386/tarballs/
          echo "Building osxcross-1.1"
          cd toolchain/osxcross-i386
          UNATTENDED=1 TARGET_DIR="$GITHUB_WORKSPACE/toolchain/osxcross-i386" ./build.sh
          echo "Verifying i386-apple-darwin9-clang"
          "$GITHUB_WORKSPACE/toolchain/osxcross-i386/bin/i386-apple-darwin9-clang" --version
          test -d "$GITHUB_WORKSPACE/toolchain/osxcross-i386/SDK/MacOSX10.5.sdk" \
            && echo "10.5 SDK staged in toolchain dir"
          echo "i386 toolchain built."

      - name: Cache i386 toolchain (save)
        if: steps.i386-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/osxcross-i386
          key: osxcross-i386-1.1-10.5

      # -------------------------------------------------------------------
      # 6. Build macOS x86_64+arm64 toolchain (osxcross master stable, 11.3)
      # -------------------------------------------------------------------
      - name: Cache macOS toolchain (restore)
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/osxcross-mac
          key: osxcross-mac-master-stable-11.3
          fail-on-cache-miss: false

      - name: Build macOS toolchain (osxcross master stable, 11.3)
        if: steps.mac-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== Step 6: Build macOS x86_64+arm64 toolchain (osxcross master, 11.3) ==="
          git clone --branch master https://github.com/tpoechtrager/osxcross.git toolchain/osxcross-mac
          git -C toolchain/osxcross-mac log -1 --oneline
          echo "Staging SDK tarball into osxcross/tarballs/"
          mkdir -p toolchain/osxcross-mac/tarballs
          cp sdk/MacOSX11.3.sdk.tar.xz toolchain/osxcross-mac/tarballs/MacOSX11.3.sdk.tar.xz
          ls -l toolchain/osxcross-mac/tarballs/
          echo "Building osxcross master stable (x86_64 + arm64)"
          cd toolchain/osxcross-mac
          UNATTENDED=1 BUILD_FLAVOR=stable \
            ENABLE_ARCHS="x86_64 arm64" \
            TARGET_DIR="$GITHUB_WORKSPACE/toolchain/osxcross-mac" \
            ./build.sh
          echo "Verifying x86_64 and arm64 clangs"
          BIN="$GITHUB_WORKSPACE/toolchain/osxcross-mac/bin"
          X64_CC=""
          ARM_CC=""
          for f in "$BIN"/x86_64-apple-darwin*-clang; do
            [ -x "$f" ] && X64_CC="$f" && break
          done
          for f in "$BIN"/arm64-apple-darwin*-clang; do
            [ -x "$f" ] && ARM_CC="$f" && break
          done
          test -n "$X64_CC" || { echo "FAIL: no x86_64 clang in $BIN"; exit 1; }
          test -n "$ARM_CC" || { echo "FAIL: no arm64 clang in $BIN"; exit 1; }
          "$X64_CC" --version
          "$ARM_CC" --version
          test -d "$GITHUB_WORKSPACE/toolchain/osxcross-mac/SDK/MacOSX11.3.sdk" \
            && echo "11.3 SDK staged in toolchain dir"
          echo "macOS toolchain built."

      - name: Cache macOS toolchain (save)
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/osxcross-mac
          key: osxcross-mac-master-stable-11.3

      # -------------------------------------------------------------------
      # 7. Build iOS armv7+arm64 toolchain (cctools-port, iPhoneOS8.4 SDK)
      # -------------------------------------------------------------------
      - name: Cache iOS toolchain (restore)
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: toolchain/ios-toolchain
          key: cctools-port-ios-8.4
          fail-on-cache-miss: false

      - name: Build iOS toolchain (cctools-port, iPhoneOS 8.4)
        if: steps.ios-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "=== Step 7: Build iOS armv7+arm64 toolchain (cctools-port, iPhoneOS 8.4) ==="
          echo "Cloning cctools-port"
          git clone https://github.com/tpoechtrager/cctools-port.git toolchain/cctools-port
          git -C toolchain/cctools-port log -1 --oneline
          echo "Building apple-libtapi (needed for .tbd stubs)"
          git clone --branch 1300.6.5 https://github.com/tpoechtrager/apple-libtapi.git toolchain/apple-libtapi
          cd toolchain/apple-libtapi
          INSTALLPREFIX="$GITHUB_WORKSPACE/toolchain/ios-toolchain" ./build.sh
          INSTALLPREFIX="$GITHUB_WORKSPACE/toolchain/ios-toolchain" ./install.sh
          cd "$GITHUB_WORKSPACE"
          echo "Building iOS toolchain (armv7 target)"
          cd toolchain/cctools-port
          LLVM_DSYMUTIL=llvm-dsymutil \
          JOBS=$(nproc) \
          ./usage_examples/ios_toolchain/build.sh \
            "$GITHUB_WORKSPACE/sdk/iPhoneOS8.4.sdk.tar.gz" armv7
          echo "Verifying iOS toolchain"
          BIN="$GITHUB_WORKSPACE/toolchain/cctools-port/usage_examples/ios_toolchain/target/bin"
          SDK="$GITHUB_WORKSPACE/toolchain/cctools-port/usage_examples/ios_toolchain/target/SDK/iPhoneOS8.4.sdk"
          test -x "$BIN/arm-apple-darwin11-clang"
          "$BIN/arm-apple-darwin11-clang" --version
          test -d "$SDK" && echo "iPhoneOS8.4 SDK staged"
          echo "Proving armv7 COMPILE AND LINK"
          # The wrapper sets COMPILER_PATH to the toolchain bin dir, but clang
          # on Linux checks the system LLVM bin dir (its InstalledDir) FIRST.
          # Symlink ld.lld -> ld64 in the system LLVM bin dir so the linker
          # resolves to the cctools-port ld64 instead of the system ld.bfd.
          INSTALLED_DIR=$("$BIN/arm-apple-darwin11-clang" --version 2>/dev/null | grep 'InstalledDir' | awk '{print $2}')
          echo "clang InstalledDir: $INSTALLED_DIR"
          if [ -n "$INSTALLED_DIR" ] && [ -d "$INSTALLED_DIR" ]; then
            echo "Symlinking $INSTALLED_DIR/ld.lld -> $BIN/ld64"
            ln -sf "$BIN/ld64" "$INSTALLED_DIR/ld.lld"
          fi
          printf 'int main(void){return 0;}\n' > /tmp/ios_link_test.c
          "$BIN/arm-apple-darwin11-clang" \
            -arch armv7 -miphoneos-version-min=5.0 \
            -isysroot "$SDK" \
            -o /tmp/ios_link_test /tmp/ios_link_test.c
          "$BIN/arm-apple-darwin11-lipo" -info /tmp/ios_link_test
          echo "armv7 link test OK"
          echo "iOS toolchain built."

      - name: Cache iOS toolchain (save)
        if: steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: toolchain/cctools-port/usage_examples/ios_toolchain/target
          key: cctools-port-ios-8.4

      # -------------------------------------------------------------------
      # 8. Resolve toolchain binary paths into env vars for the Makefile
      # -------------------------------------------------------------------
      - name: Resolve toolchain paths
        id: paths
        run: |
          set -e
          echo "=== Step 8: Resolve toolchain paths ==="
          WS="$GITHUB_WORKSPACE"
          PPC_XC="$WS/toolchain/$PPC_INSTALL_DIR"
          I386_BIN="$WS/toolchain/osxcross-i386/bin"
          I386_CC="$I386_BIN/i386-apple-darwin9-clang"
          I386_SDK="$WS/toolchain/osxcross-i386/SDK/MacOSX10.5.sdk"
          I386_LIPO="$I386_BIN/i386-apple-darwin9-lipo"
          MAC_BIN="$WS/toolchain/osxcross-mac/bin"
          MAC_SDK="$WS/toolchain/osxcross-mac/SDK/MacOSX11.3.sdk"
          IOS_BIN="$WS/toolchain/cctools-port/usage_examples/ios_toolchain/target/bin"
          IOS_SDK="$WS/toolchain/cctools-port/usage_examples/ios_toolchain/target/SDK/iPhoneOS8.4.sdk"
          IOS_CC="$IOS_BIN/arm-apple-darwin11-clang"
          # Discover osxcross x86_64/arm64 clang/vtool/otool via glob
          # (darwin suffix varies, e.g. darwin20.4).
          X64_CC=""
          ARM_MAC_CC=""
          VTOOL=""
          OTOOL=""
          for f in "$MAC_BIN"/x86_64-apple-darwin*-clang; do
            [ -x "$f" ] && X64_CC="$f" && break
          done
          for f in "$MAC_BIN"/arm64-apple-darwin*-clang; do
            [ -x "$f" ] && ARM_MAC_CC="$f" && break
          done
          for f in "$MAC_BIN"/x86_64-apple-darwin*-vtool; do
            [ -x "$f" ] && VTOOL="$f" && break
          done
          for f in "$MAC_BIN"/x86_64-apple-darwin*-otool; do
            [ -x "$f" ] && OTOOL="$f" && break
          done
          test -n "$X64_CC" || { echo "FAIL: no x86_64 clang in $MAC_BIN"; exit 1; }
          test -n "$ARM_MAC_CC" || { echo "FAIL: no arm64 clang in $MAC_BIN"; exit 1; }
          test -n "$VTOOL" || { echo "FAIL: no vtool in $MAC_BIN"; exit 1; }
          test -n "$OTOOL" || { echo "FAIL: no otool in $MAC_BIN"; exit 1; }
          echo "Discovered: X64_CC=$X64_CC"
          echo "Discovered: ARM_MAC_CC=$ARM_MAC_CC"
          echo "Discovered: VTOOL=$VTOOL"
          echo "Discovered: OTOOL=$OTOOL"
          {
            echo "PPC_XC=$PPC_XC"
            echo "PPC_CC=$PPC_XC/bin/ppc-ld64-gcc"
            echo "PPC_SDK=$PPC_XC/sdk/MacOSX10.4u.sdk"
            echo "I386_CC=$I386_CC"
            echo "I386_SDK=$I386_SDK"
            echo "X64_CC=$X64_CC"
            echo "ARM_MAC_CC=$ARM_MAC_CC"
            echo "MAC_SDK_NEW=$MAC_SDK"
            echo "IOS_CC=$IOS_CC"
            echo "IOS_SDK=$IOS_SDK"
            echo "IOS_BIN=$IOS_BIN"
            # Use the legacy osxcross-1.1 lipo (PPC-capable) for fat creation.
            echo "LIPO=$I386_LIPO"
            echo "VTOOL=$VTOOL"
            echo "OTOOL=$OTOOL"
            echo "LDID=$IOS_BIN/ldid"
          } >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # 9. Build all slices + fat binaries
      # -------------------------------------------------------------------
      - name: Build all slices + fat binaries
        env:
          PPC_XC: ${{ steps.paths.outputs.PPC_XC }}
          PPC_CC: ${{ steps.paths.outputs.PPC_CC }}
          PPC_SDK: ${{ steps.paths.outputs.PPC_SDK }}
          I386_CC: ${{ steps.paths.outputs.I386_CC }}
          I386_SDK: ${{ steps.paths.outputs.I386_SDK }}
          X64_CC: ${{ steps.paths.outputs.X64_CC }}
          ARM_MAC_CC: ${{ steps.paths.outputs.ARM_MAC_CC }}
          MAC_SDK_NEW: ${{ steps.paths.outputs.MAC_SDK_NEW }}
          IOS_CC: ${{ steps.paths.outputs.IOS_CC }}
          IOS_SDK: ${{ steps.paths.outputs.IOS_SDK }}
          IOS_BIN: ${{ steps.paths.outputs.IOS_BIN }}
          LIPO: ${{ steps.paths.outputs.LIPO }}
          VTOOL: ${{ steps.paths.outputs.VTOOL }}
          OTOOL: ${{ steps.paths.outputs.OTOOL }}
          LDID: ${{ steps.paths.outputs.LDID }}
        run: |
          set -e
          echo "=== Step 9: make all (6 slices + 2 fat binaries) ==="
          make all

      # -------------------------------------------------------------------
      # 10. Validate (lipo -info + arch-set assertion + per-slice min-OS)
      # -------------------------------------------------------------------
      - name: Validate (arch sets + min-OS)
        env:
          LIPO: ${{ steps.paths.outputs.LIPO }}
          VTOOL: ${{ steps.paths.outputs.VTOOL }}
          OTOOL: ${{ steps.paths.outputs.OTOOL }}
          PPC_XC: ${{ steps.paths.outputs.PPC_XC }}
        run: |
          set -e
          echo "=== Step 10: make validate ==="
          make validate
          echo "=== build/manifest.txt ==="
          cat build/manifest.txt

          echo ""
          echo "=== HARD arch-set assertion ==="
          echo "--- lipo -info dist/fizzbuzz-macos ---"
          "$LIPO" -info dist/fizzbuzz-macos
          echo "--- lipo -info dist/fizzbuzz-ios ---"
          "$LIPO" -info dist/fizzbuzz-ios

          #
          # Verify the EXACT arch set by reading each thin slice's Mach-O
          # cputype (ground truth) — lipo's textual label for a PowerPC
          # ALL slice is "ppc603" in some lipo builds (a known quirk), so
          # we do NOT rely on the ppc label text; we check cputype==18
          # (CPU_TYPE_POWERPC) directly. The other three arches have stable
          # labels and are also confirmed via lipo -info.
          #
          python3 - <<'PY'
          import struct, sys

          def thin_cputype(path):
              with open(path, "rb") as f:
                  d = f.read(16)
              le_magic = struct.unpack("<I", d[:4])[0]
              if le_magic in (0xFEEDFACE, 0xFEEDFACF):
                  return [struct.unpack("<i", d[4:8])[0]]
              be_magic = struct.unpack(">I", d[:4])[0]
              if be_magic == 0xCAFEBABE:        # FAT_MAGIC (BE)
                  nfat = struct.unpack(">I", d[4:8])[0]
                  endian = ">"
              elif le_magic == 0xBEBAFECA:      # FAT_MAGIC (LE)
                  nfat = struct.unpack("<I", d[4:8])[0]
                  endian = "<"
              else:
                  raise ValueError("unknown magic %x/%x in %s"
                                   % (be_magic, le_magic, path))
              with open(path, "rb") as f:
                  f.seek(8)
                  cts = []
                  for _ in range(nfat):
                      ct, _cs = struct.unpack(endian + "II", f.read(8))
                      f.read(12)
                      cts.append(ct)
                  return cts

          CPU_TYPE = {18: "ppc", 7: "i386", 16777223: "x86_64",
                      16777228: "arm64", 12: "arm"}

          def check_fat(fat_path, expected):
              cts = thin_cputype(fat_path)
              names = sorted(CPU_TYPE.get(c, str(c)) for c in cts)
              want = sorted(expected)
              print("  %s: cputypes=%s names=%s" % (fat_path, cts, names))
              if names != want:
                  print("FAIL: %s arch set %s != expected %s"
                        % (fat_path, names, want))
                  sys.exit(1)
              print("  OK: %s has exactly %s" % (fat_path, want))

          check_fat("dist/fizzbuzz-macos", ["ppc", "i386", "x86_64", "arm64"])
          check_fat("dist/fizzbuzz-ios", ["arm", "arm64"])
          print("=== arch sets OK ===")
          PY

          echo ""
          echo "=== Per-slice min-OS report ==="
          bash scripts/report_minos.sh build/slices

      # -------------------------------------------------------------------
      # 11. Host test
      # -------------------------------------------------------------------
      - name: Host test
        run: |
          set -e
          echo "=== Step 11: make test-host ==="
          make test-host

      # -------------------------------------------------------------------
      # 12. Upload artifacts (ONLY the two tiny fat binaries + manifest)
      # -------------------------------------------------------------------
      - name: Upload fizzbuzz-macos
        uses: actions/upload-artifact@v4
        with:
          name: fizzbuzz-macos
          path: dist/fizzbuzz-macos
          if-no-files-found: error

      - name: Upload fizzbuzz-ios
        uses: actions/upload-artifact@v4
        with:
          name: fizzbuzz-ios
          path: dist/fizzbuzz-ios
          if-no-files-found: error

      - name: Upload build-manifest
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: build/manifest.txt
          if-no-files-found: error

      # -------------------------------------------------------------------
      # Final summary
      # -------------------------------------------------------------------
      - name: Final summary
        run: |
          echo ""
          echo "=== FINAL SUMMARY ==="
          echo "macOS Quad-Fat: ppc i386 x86_64 arm64  (min-OS 10.4/10.5/10.9/11.0)"
          echo "iOS FAT:        armv7 arm64            (min-OS 5.0/7.0, ad-hoc signed)"
          echo "Host test:      PASS"
          echo "ALL VALIDATIONS PASSED"
